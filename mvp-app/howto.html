<header>
  <a class="back" href="index.html">&#8249; Hub</a>
  <h1>House How-To Codes</h1>
  <div class="sub">Per-Room Guides by Property</div>
</header>

<div class="hint">How-to codes grouped by house &mdash; each opens a short guide (fireplace, AC, hot tub, etc.) hosted on the guest-guide site. <strong>Press &amp; hold a code</strong> to save or share it for a label. Codes appear here as videos are added.</div>

<main id="main"></main>

<footer>v6 - 2026-06-24</footer>

<script>
/* HOW TO ADD A CODE:
   1. A per-item page is created on the guide site, e.g. https://a799608.github.io/mvp-guest-guides/trails/fireplace/
   2. A QR PNG is generated into mvp-app/qr/howto/  (e.g. QR_trails_fireplace.png)
   3. Add an entry to the right house below:
      { label: "Fireplace", url: "https://a799608.github.io/mvp-guest-guides/trails/fireplace/", img: "qr/howto/QR_trails_fireplace.png" }
*/
const HOWTO = {
  "Trails":    [],
  "Pound":     [],
  "Milton":    [],
  "Wylie":     [],
  "MacCauley": [],
  "Petrarch":  []
};
(function render(){
  var m = document.getElementById('main');
  Object.keys(HOWTO).forEach(function(house){
    var sec = document.createElement('section'); sec.className = 'house';
    var h = document.createElement('h2'); h.className = 'house-h'; h.textContent = house; sec.appendChild(h);
    var items = HOWTO[house] || [];
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No how-to codes yet.'; sec.appendChild(e);
    } else {
      var grid = document.createElement('div'); grid.className = 'grid';
      items.forEach(function(it){
        var c = document.createElement('div'); c.className = 'qr-card';
        var shortUrl = it.url.replace(/^https?:\/\//, '');
        c.innerHTML = '<h3>' + it.label + '</h3>' +
          '<div class="panel"><img src="' + it.img + '" alt="' + it.label + ' QR code"></div>' +
          '<div class="url">' + shortUrl + '</div>' +
          '<a class="open" href="' + it.url + '">Open</a>';
        grid.appendChild(c);
      });
      sec.appendChild(grid);
    }
    m.appendChild(sec);
  });
})();
</script>

</body>
